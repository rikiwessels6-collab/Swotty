name: Upload to TestFlight

# Run manually: GitHub → Actions → "Upload to TestFlight" → Run workflow.
# Needs the repository secrets listed in docs/TESTFLIGHT.md.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see docs/TESTFLIGHT.md)"; exit 1; fi
          done
          if [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::Missing secret ASC_KEY_P8 (see docs/TESTFLIGHT.md)"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          else
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          fi

      # Checks the shape of each secret (never prints their values) so a
      # typo is reported here instead of as a vague 401 from Apple.
      - name: Validate secrets
        run: |
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          ok=1
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID should be 10 letters/numbers (check for spaces or extra characters)"; ok=0
          fi
          if ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::ASC_KEY_ID should be 10 letters/numbers, e.g. the part of AuthKey_XXXXXXXXXX.p8 between the underscore and .p8"; ok=0
          fi
          if ! [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::ASC_ISSUER_ID should look like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx (copy it from the top of the App Store Connect API page)"; ok=0
          fi
          if ! head -n 1 "$KEY_FILE" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            echo "::error::ASC_KEY_P8 must start with the line -----BEGIN PRIVATE KEY-----"; ok=0
          fi
          if ! tail -n 1 "$KEY_FILE" | grep -q -- '-----END PRIVATE KEY-----'; then
            echo "::error::ASC_KEY_P8 must end with the line -----END PRIVATE KEY-----"; ok=0
          fi
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 could not be read as a private key. Re-copy the whole text of the .p8 file."; ok=0
          fi
          if [ "$ok" = 1 ]; then echo "All secrets look correctly formatted."; else exit 1; fi

      # The archive is built unsigned on purpose: an automatically signed
      # archive needs a development profile, which needs a registered
      # device. The export step below signs for the App Store instead.
      - name: Archive
        run: |
          xcodebuild archive \
            -project Swotty.xcodeproj \
            -scheme Swotty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Swotty.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Swotty.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
