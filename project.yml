# XcodeGen project definition. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate
# then open Swotty.xcodeproj.
name: Swotty

options:
  bundleIdPrefix: com.boundaryline
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Apple reports 1.5 as the latest approved version, so this update is 1.6.
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (Membership page in developer.apple.com)
    # DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  Swotty:
    type: application
    platform: iOS
    sources:
      - path: Swotty
    dependencies:
      - target: SwottyWidget
    entitlements:
      path: Config/Swotty.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.boundaryline.swotty
    settings:
      base:
        # TODO: replace with the bundle ID registered in
        # Certificates, Identifiers & Profiles.
        PRODUCT_BUNDLE_IDENTIFIER: com.boundaryline.swotty
        PRODUCT_NAME: Swotty
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Swotty/Resources/Info.plist
    info:
      path: Swotty/Resources/Info.plist
      properties:
        CFBundleDisplayName: Swotty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required for Calendar sync (iOS 17+ and earlier). Without these
        # the app crashes when it asks for access.
        NSCalendarsFullAccessUsageDescription: >-
          Swotty adds your assessment due dates to a Swotty calendar so you
          can see them in the Calendar app.
        NSCalendarsUsageDescription: >-
          Swotty adds your assessment due dates to a Swotty calendar so you
          can see them in the Calendar app.
        ITSAppUsesNonExemptEncryption: false

  SwottyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SwottyWidget
      - path: Swotty/Shared
    entitlements:
      path: Config/SwottyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.boundaryline.swotty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundaryline.swotty.widget
        PRODUCT_NAME: SwottyWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SwottyWidget/Info.plist
    info:
      path: SwottyWidget/Info.plist
      properties:
        CFBundleDisplayName: Swotty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The widget reads the timetable from the Calendar app.
        NSCalendarsFullAccessUsageDescription: >-
          Swotty shows your next class and what's due, using your Swotty
          calendars in the Calendar app.
        NSCalendarsUsageDescription: >-
          Swotty shows your next class and what's due, using your Swotty
          calendars in the Calendar app.

  SwottyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwottyTests
    dependencies:
      - target: Swotty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundaryline.swotty.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Swotty:
    build:
      targets:
        Swotty: all
    test:
      targets:
        - SwottyTests
